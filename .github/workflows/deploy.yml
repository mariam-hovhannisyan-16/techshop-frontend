name: Deploy to EC2

# Fires after "Frontend CI" (ci.yml) completes on main, so a deploy only ever
# follows a green build-and-test run - the guard below still double-checks
# the conclusion in case this ever gets triggered another way. workflow_dispatch
# is included so a deploy can be re-run manually without needing a new commit
# (e.g. to retry after a transient SSH failure, or to redeploy unchanged code).
on:
  workflow_run:
    workflows: ["Frontend CI"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Deploy over SSH by replicating the exact manual sequence this app has
      # always been deployed with: sync to the latest main, rebuild the
      # Docker image from the root Dockerfile, and swap the running container.
      # The frontend isn't part of the backend's docker-compose stack, so
      # this is a standalone container rather than `docker compose up`.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/techshop-frontend

            # git reset --hard instead of git pull: robust if the server's
            # working tree ever drifts (a plain pull can fail on conflicts;
            # reset --hard can't).
            git fetch origin main
            git reset --hard origin/main

            docker build -t techshop-frontend .
            docker stop techshop-frontend
            docker rm techshop-frontend
            docker run -d --name techshop-frontend -p 80:80 --restart unless-stopped techshop-frontend

            # Clean up the now-dangling previous image so disk usage doesn't
            # slowly grow with every deploy.
            docker image prune -f
