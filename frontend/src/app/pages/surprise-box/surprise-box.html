<div class="surprise-box-container">
  <app-header [subtitle]="'SURPRISE_BOX' | translate">
    <div header-actions class="nav-actions">
      <button class="back-btn" (click)="router.navigate(['/products'])">← {{ 'BACK_TO_PRODUCTS' | translate }}</button>
    </div>
  </app-header>

  <div class="surprise-box-content">
    <h1>🎁 {{ 'SURPRISE_BOX' | translate }}</h1>

    <form class="budget-form" (ngSubmit)="generate()">
      <label>
        <span>{{ 'SURPRISE_BOX_BUDGET_LABEL' | translate }}</span>
        <input type="number" name="budget" min="1" step="1" [(ngModel)]="budget" required>
      </label>
      <button type="submit" class="generate-btn" [disabled]="loading || !budget || budget <= 0">
        <app-icon name="gift" /> {{ 'SURPRISE_BOX_GENERATE_BTN' | translate }}
      </button>
    </form>

    @if (loading) {
      <app-skeleton [count]="4" />
    } @else if (hasError) {
      <app-empty-state icon="warning" [message]="'SURPRISE_BOX_ERROR' | translate">
        <button (click)="generate()">{{ 'RETRY' | translate }}</button>
      </app-empty-state>
    } @else if (result) {
      @if (result.items.length > 0) {
        <div class="box-summary">
          {{ 'SURPRISE_BOX_SUMMARY' | translate: { total: formattedTotal, budget: formattedBudget } }}
        </div>
        <div class="box-grid">
          @for (product of result.items; track product.id) {
            <app-product-card
              [product]="product"
              (view)="viewProduct($event)"
              (addToCart)="addToCart($event)"
            />
          }
        </div>
      } @else {
        <app-empty-state icon="gift" [message]="'SURPRISE_BOX_EMPTY' | translate" />
      }
      <button type="button" class="try-again-btn" (click)="generate()">
        <app-icon name="refresh" /> {{ 'SURPRISE_BOX_TRY_AGAIN_BTN' | translate }}
      </button>
    }
  </div>

  <app-toast />
</div>
