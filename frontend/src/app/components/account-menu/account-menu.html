<div class="account-menu">
  <button type="button" class="header-action-btn" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen">
    <span class="icon-wrap">
      <span class="icon"><app-icon name="user" /></span>
    </span>
    <span class="label">{{ (isLoggedIn ? 'ACCOUNT' : 'LOGIN') | translate }}</span>
  </button>

  @if (menuOpen && isLoggedIn) {
    <div class="account-dropdown">
      <button (click)="goTo('/profile')"><app-icon name="user" /> {{ 'PROFILE' | translate }}</button>
      @if (!isAdmin) {
        <button (click)="goTo('/orders')"><app-icon name="box" /> {{ 'ORDERS' | translate }}</button>
        <button (click)="goTo('/wishlist')"><app-icon name="heart" /> {{ 'WISHLIST' | translate }}</button>
      }
      <button class="logout" (click)="logout()"><app-icon name="logout" /> {{ 'LOGOUT' | translate }}</button>
    </div>
  }
</div>
