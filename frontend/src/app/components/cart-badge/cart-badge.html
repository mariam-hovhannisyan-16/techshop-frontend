<button type="button" class="header-action-btn" (click)="goToCart()">
  <span class="icon-wrap">
    <span class="icon"><app-icon name="cart" /></span>
    @if (count > 0) {
      <span class="badge badge-accent">{{ count }}</span>
    }
  </span>
  <span class="label">{{ 'CART' | translate }}</span>
</button>
