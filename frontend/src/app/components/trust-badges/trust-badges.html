<div class="trust-badges">
  @for (badge of badges; track badge.titleKey) {
    <div class="trust-badge">
      <span class="trust-icon"><app-icon [name]="badge.icon" /></span>
      <div class="trust-text">
        <strong>{{ badge.titleKey | translate }}</strong>
        <span>{{ badge.subtitleKey | translate }}</span>
      </div>
    </div>
  }
</div>
